services:
  - type: web
    name: drami-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 2567
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: CLIENT_ORIGIN
        value: https://drami.vercel.app
